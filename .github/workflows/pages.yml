name: Deploy GitHub Pages

on:
  # Le LXC pousse un commit "Auto update dashboard" toutes les 3 minutes.
  # Un declenchement sur chaque push fait s'annuler les deploiements les uns
  # les autres en boucle des qu'un deploiement met plus de ~3 min a finir :
  # GitHub Pages n'autorise qu'un deploiement a la fois par depot et annule
  # l'ancien des qu'un nouveau demarre. Un planning toutes les 15 minutes
  # laisse largement le temps a chaque deploiement de se terminer avant le
  # suivant. Voir docs/DEVELOPMENT.md.
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
