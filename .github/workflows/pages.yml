name: Deploy GitHub Pages

on:
  # Declenchement sur push : le LXC pousse un commit "Auto update dashboard"
  # toutes les ~3 minutes, et un deploiement ne dure que ~20 secondes. Il n'y a
  # donc aucun risque de chevauchement, et le site suit les donnees de pres.
  push:
    branches:
      - main
  # Filet de securite : si les deploiements sur push cessent d'aboutir (voir
  # "Deploiement GitHub Pages" dans docs/DEVELOPMENT.md), le planning continue
  # de tenter une publication. GitHub decale fortement les workflows planifies
  # (observe : ~32 min de moyenne pour un cron */15), donc il ne sert QUE de
  # secours, jamais de mecanisme principal.
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
