name: Deploy GitHub Pages

on:
  # Declenchement sur push : le LXC pousse un commit "Auto update dashboard"
  # toutes les ~3 minutes, et un deploiement ne dure que ~20 secondes. Il n'y a
  # donc aucun risque de chevauchement, et le site suit les donnees de pres.
  push:
    branches:
      - main
  # Filet de securite : si les deploiements sur push cessent d'aboutir (voir
  # "Deploiement GitHub Pages" dans docs/DEVELOPMENT.md), le planning continue
  # de tenter une publication. GitHub decale fortement les workflows planifies
  # (observe : ~32 min de moyenne pour un cron */15), donc il ne sert QUE de
  # secours, jamais de mecanisme principal.
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      # deploy-pages interroge l'index des artefacts juste apres le televersement
      # et ne l'y trouve pas toujours : "No artifacts named github-pages were
      # found for this workflow run", alors que l'artefact existe bel et bien
      # (constate le 22/11/2026 : artefact cree a 16:12:36, deploiement en echec
      # a 16:12:40). Le defaut est chez GitHub et il est intermittent ; en
      # poussant toutes les 3 min on le rencontre plusieurs fois par dimanche.
      # Un second essai 20 s plus tard suffit, et un echec persistant fait
      # toujours echouer le job.
      - name: Deploy
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Attente avant second essai
        if: steps.deployment.outcome == 'failure'
        run: sleep 20

      - name: Deploy (second essai)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
